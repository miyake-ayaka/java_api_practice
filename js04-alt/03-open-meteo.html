<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.1/css/bulma.min.css">
    <!-- axios 読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- jQuery 読み込み -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title>天気予報</title>
</head>
<body>
<div class="container py-2">
    <h1 class="title is-2 has-text-info">
        Open-Meteo 天気予報
    </h1>
    <div class="field is-grouped mb-4">
        <div class="control">
            <div class="select">
                <select id="city">
                    <!-- 都市の選択肢は JavaScript で追加する -->
                </select>
            </div>
        </div>
        <div class="control">
            <button id="show" class="button is-info">天気を見る</button>
        </div>
    </div>
    <div id="current" class="box">都市を選んで「天気を見る」を押してください</div>
    <div id="daily" class="columns is-mobile"></div>
</div>

<script>
// ----------------------------
// Open-Meteo API: https://open-meteo.com/en/docs
// APIキー不要。緯度（latitude）と経度（longitude）を渡すと、その場所の天気が返ってくる
// ----------------------------

// 都市の一覧（名前・緯度・経度）を配列で持っておく
const cities = [
    { name: "東京", lat: 35.6895, lon: 139.6917 },
    { name: "札幌", lat: 43.0642, lon: 141.3469 },
    { name: "仙台", lat: 38.2682, lon: 140.8694 },
    { name: "名古屋", lat: 35.1815, lon: 136.9066 },
    { name: "大阪", lat: 34.6937, lon: 135.5023 },
    { name: "福岡", lat: 33.5902, lon: 130.4017 },
    { name: "那覇", lat: 26.2124, lon: 127.6809 }
];

// 天気コード（数字）を日本語に変換する関数
// コードの意味: https://open-meteo.com/en/docs の「WMO Weather interpretation codes」
function weatherText(code) {
    if (code === 0) return "快晴";
    if (code <= 3) return "晴れ・くもり";
    if (code <= 48) return "霧";
    if (code <= 67) return "雨";
    if (code <= 77) return "雪";
    if (code <= 82) return "にわか雨";
    if (code <= 86) return "にわか雪";
    return "雷雨";
}

// 都市の一覧をセレクトボックスに追加（value には配列の番号を入れておく）
cities.forEach(function (city, index) {
    $("#city").append(`<option value="${index}">${city.name}</option>`);
});

$("#show").on("click", function () {
    const city = cities[$("#city").val()]; // 選ばれた都市を取り出す
    $("#current").text("取得中...");
    $("#daily").empty();

    axios.get("https://api.open-meteo.com/v1/forecast", {
        params: {
            latitude: city.lat,
            longitude: city.lon,
            current: "temperature_2m,weather_code", // 今の気温と天気
            daily: "weather_code,temperature_2m_max,temperature_2m_min", // 日ごとの天気・最高・最低気温
            timezone: "Asia/Tokyo",
            forecast_days: 5
        }
    }).then(function (response) {
        console.log(response.data); // 中身を確認してみよう

        // 今の天気
        const current = response.data.current;
        $("#current").html(`
            <p class="is-size-5">${city.name}の今の天気</p>
            <p class="is-size-3 has-text-weight-bold">${weatherText(current.weather_code)} ${current.temperature_2m}℃</p>
        `);

        // 日ごとの予報（daily は「日付の配列」「最高気温の配列」…と項目ごとに配列で返ってくる）
        const daily = response.data.daily;
        daily.time.forEach(function (date, i) {
            $("#daily").append(`
                <div class="column">
                    <div class="box has-text-centered">
                        <p class="is-size-7 has-text-grey">${date.slice(5)}</p>
                        <p class="has-text-weight-bold">${weatherText(daily.weather_code[i])}</p>
                        <p><span class="has-text-danger">${daily.temperature_2m_max[i]}</span> / <span class="has-text-info">${daily.temperature_2m_min[i]}</span></p>
                    </div>
                </div>
            `);
        });
    }).catch(function (error) {
        $("#current").text("通信に失敗しました。時間をおいて試してください。");
        console.log(error);
    });
});
</script>
</body>
</html>
