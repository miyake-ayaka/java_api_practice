// 引数つき挨拶関数 greet(name) に変更
function greet(name) {
    console.log(`こんにちは ${name} さん`);
    console.log('いい天気ですね');
}
greet("miyake");
greet("tanaka");

// 複数の引数を取得する関数 fullGreet(firstName, lastName)

function fullGreet(firstName, lastName) {
    console.log(`こんにちは ${firstName} ${lastName} さん`);
    console.log('いい天気ですね');
}
fullGreet("ayaka", "miyake");

</script>
